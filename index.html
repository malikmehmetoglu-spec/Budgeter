<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budgeter</title>
<meta name="theme-color" content="#B4BDB1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budgeter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<style>
:root{
  --bg:#B4BDB1; --card:#F6F7F2; --soft:#E3E7DE; --line:#D3D8CD;
  --lime:#DCF25A; --lime-ink:#1B2208; --ink:#121411; --muted:#6A7166; --faint:#9AA196;
  --dark:#121411; --dark-ink:#F4F6EF; --dark-muted:#9BA197;
  --good:#3F8F4E; --bad:#C2472F;
  --r:30px; --r-sm:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1B1F1A; --card:#262B24; --soft:#30362D; --line:#3A4137;
    --ink:#EEF1E8; --muted:#A3AA9E; --faint:#737A6F;
    --dark:#0C0E0B; --good:#7FC98B; --bad:#EE8A73;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Outfit","Readex Pro",system-ui,sans-serif; font-weight:400; font-size:15px;
  padding:env(safe-area-inset-top,0) 16px calc(96px + env(safe-area-inset-bottom,0));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:"Outfit",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:1180px;margin:0 auto}
[hidden]{display:none!important}

/* header */
.top{display:flex;align-items:center;gap:10px;padding-block:18px 14px}
.brand{font-size:26px;font-weight:500;letter-spacing:-.03em;margin-inline-end:auto;display:flex;align-items:center;gap:10px}
.brand i{width:34px;height:34px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.pill{height:44px;border-radius:99px;background:var(--card);display:inline-flex;align-items:center;gap:8px;padding:0 16px;font-weight:500;white-space:nowrap}
.round{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.round.ink{background:var(--ink);color:var(--card)}
.round svg,.pill svg{width:18px;height:18px}
.month{padding:0 6px}
.month b{min-width:96px;text-align:center;font-weight:500}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.month button:hover{background:var(--soft)}

/* nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0));display:flex;justify-content:center;pointer-events:none}
.nav div{pointer-events:auto;display:flex;gap:4px;background:var(--dark);padding:6px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.nav button{color:var(--dark-muted);height:46px;padding:0 16px;border-radius:99px;display:flex;align-items:center;gap:8px;font-size:14px}
.nav button svg{width:20px;height:20px}
.nav button[aria-current="page"]{background:var(--lime);color:var(--lime-ink)}
@media (max-width:560px){.nav button span{display:none}.nav button[aria-current="page"] span{display:inline}.nav button{padding:0 13px}}

/* bento */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--card);border-radius:var(--r);padding:22px;position:relative;min-width:0}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
@media (max-width:900px){.span-8,.span-7,.span-5{grid-column:span 12}.span-4{grid-column:span 6}.span-3{grid-column:span 6}}
@media (max-width:560px){.span-6,.span-4{grid-column:span 12}}
.h{font-size:28px;line-height:1.05;font-weight:400;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lbl{font-size:13px;color:var(--muted)}
.big{font-size:clamp(46px,9vw,76px);font-weight:300;line-height:.95;letter-spacing:-.045em}
.mid{font-size:clamp(30px,5vw,40px);font-weight:300;line-height:1;letter-spacing:-.035em}
.cur{font-size:.38em;font-weight:400;color:var(--muted);margin-inline-start:6px;letter-spacing:0}

/* hero with notch */
.hero{background:var(--lime);color:var(--lime-ink);padding-top:74px}
.hero .lbl{color:rgba(27,34,8,.62)}
.hero .cur{color:rgba(27,34,8,.55)}
.notch{position:absolute;top:0;left:0;background:var(--bg);padding:0 0 10px 10px;border-bottom-right-radius:28px;display:flex;gap:8px}
.notch::before,.notch::after{content:"";position:absolute;width:28px;height:28px;background:radial-gradient(circle at 100% 100%,transparent 27.5px,var(--bg) 28px)}
.notch::before{top:0;left:100%}
.notch::after{top:100%;left:0}
.notch .round{width:52px;height:52px}
.hero-title{position:absolute;top:22px;right:22px;display:flex;align-items:center;gap:10px}
.hero-title .av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center}
.hero-title small{display:block;font-size:12px;opacity:.6}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.75);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .6s}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* smart add */
.smart{display:flex;gap:8px;margin-top:20px}
.smart label{flex:1;display:flex;align-items:center;gap:10px;height:56px;border-radius:99px;border:1.5px solid rgba(27,34,8,.28);padding:0 8px 0 18px;background:rgba(255,255,255,.35);min-width:0}
.smart label i{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.smart input{flex:1;border:0;background:none;outline:0;font-size:16px;min-width:0;color:var(--lime-ink)}
.smart input::placeholder{color:rgba(27,34,8,.5)}
.smart .round{width:56px;height:56px}
.preview{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{height:34px;border-radius:99px;padding:0 13px;display:inline-flex;align-items:center;gap:6px;font-size:13px;background:rgba(255,255,255,.6);color:var(--lime-ink);border:1px solid transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--lime)}
.chip.warn{background:#fff;border-color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick .chip{background:transparent;border-color:rgba(27,34,8,.25)}

/* stat tiles */
.tile{display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-height:150px}
.tile .ic{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.tile .ic svg{width:19px;height:19px}
.tile.soft{background:var(--soft)}
.tile.ink{background:var(--dark);color:var(--dark-ink)}
.tile.ink .lbl,.tile.ink .cur{color:var(--dark-muted)}
.tile.ink .ic{background:var(--lime);color:var(--lime-ink)}
.delta{font-size:12px;border-radius:99px;padding:3px 9px;background:var(--soft);white-space:nowrap}
.delta.good{color:var(--good)}.delta.bad{color:var(--bad)}

/* curve card */
.curve{background:var(--dark);color:var(--dark-ink);overflow:hidden;padding-bottom:0}
.curve .lbl{color:var(--dark-muted)}
.curve svg{display:block;width:calc(100% + 44px);margin-inline:-22px;height:190px}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
.day{border-radius:99px;background:var(--card);border:1px solid var(--line);padding:14px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.soft .day{background:var(--card)}
.day b{font-size:22px;font-weight:400}
.day small{font-size:11px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.day[aria-pressed="true"] small{color:rgba(27,34,8,.6)}
.day.out{opacity:.35}
.dots{display:grid;grid-template-columns:repeat(7,1fr);margin-top:12px;position:relative}
.dots::before{content:"";position:absolute;inset-inline:6%;top:50%;border-top:1px dashed var(--faint)}
.dots i{justify-self:center;width:6px;height:6px;border-radius:50%;background:var(--faint);position:relative}
.dots i.on{width:10px;height:10px;background:var(--ink)}

/* category bars */
.cats{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.cat{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.track{height:42px;border-radius:99px;background:repeating-linear-gradient(-45deg,var(--soft) 0 6px,transparent 6px 12px);position:relative;overflow:hidden}
.fill{position:absolute;inset-block:0;right:0;border-radius:99px;background:var(--soft);display:flex;align-items:center;gap:8px;padding:0 14px;white-space:nowrap;font-size:14px;min-width:fit-content}
.cat:first-child .fill{background:var(--lime);color:var(--lime-ink)}
.fill svg{width:16px;height:16px}
.cat .pc{font-size:13px;color:var(--muted);min-width:78px;text-align:left}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.item .ic svg{width:18px;height:18px}
.item b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted);font-size:12px}
.item .amt{text-align:left;font-size:18px}
.item .amt small{display:block}
.item button.more{width:34px;height:34px;border-radius:50%}
.group{font-size:13px;color:var(--muted);margin-top:14px;display:flex;justify-content:space-between}
.empty{color:var(--muted);padding:26px 0;text-align:center}

/* debts */
.debt{display:flex;flex-direction:column;gap:16px;cursor:pointer;text-align:start;width:100%}
.debt.lime{background:var(--lime);color:var(--lime-ink)}
.debt.lime .lbl,.debt.lime .cur{color:rgba(27,34,8,.6)}
.debt.lime .bar{background:rgba(255,255,255,.7)}
.debt .bar{background:var(--soft);height:8px}
.debt .who{display:flex;align-items:center;gap:10px}
.debt .who i{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-weight:500;font-style:normal;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:rgba(255,255,255,.45);border-radius:18px;padding:10px 12px}
.card:not(.lime) .facts div{background:var(--soft)}
.facts b{display:block;font-size:18px;font-weight:400}
.facts small{font-size:11px;opacity:.7}
.addcard{border:1.5px dashed var(--faint);background:transparent;display:grid;place-items:center;min-height:180px;color:var(--muted);gap:8px;align-content:center}

/* savings */
.jar{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.jar-fill{width:120px;height:160px;border-radius:40px 40px 34px 34px;background:var(--soft);position:relative;overflow:hidden;border:2px solid var(--line)}
.jar-fill i{position:absolute;inset-inline:0;bottom:0;background:var(--lime);transition:height .8s}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,9,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{background:var(--card);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:32px 32px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0));animation:up .25s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:32px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h3{margin:0 0 16px;font-size:24px;font-weight:400;display:flex;justify-content:space-between;align-items:center}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f span{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{height:52px;border-radius:16px;border:1px solid var(--line);background:var(--bg);background:color-mix(in srgb,var(--soft) 60%,var(--card));padding:0 16px;font-size:16px;outline:0;width:100%}
.f textarea{height:80px;padding:12px 16px;resize:none}
.f input:focus,.f select:focus{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;height:42px;border-radius:99px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.btn{height:54px;border-radius:99px;background:var(--ink);color:var(--card);font-weight:500;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid currentColor}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;margin-top:6px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:12px 20px;border-radius:99px;z-index:60;font-size:14px;animation:up .2s}

/* auth */
.auth{max-width:420px;margin:8vh auto 0}
.auth .hero{padding-top:90px}

.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0 14px}
.sectionhead .h{font-size:34px}
.ratepill{font-size:13px}
.ratepill b{font-size:15px;font-weight:500}
.stale{width:8px;height:8px;border-radius:50%;background:var(--bad)}
@media (max-width:560px){.brand{font-size:20px}.brand i{width:30px;height:30px}.ratepill .lbl{display:none}.top{gap:6px}.pill{padding:0 12px}.month{padding:0 4px}}
.side{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side .tile{min-height:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- helpers ---------- */
const MONTHS=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];

const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const addMonths=(d,n)=>{const r=new Date(d);r.setDate(1);r.setMonth(r.getMonth()+n);r.setDate(Math.min(d.getDate(),dim(r.getFullYear(),r.getMonth())));return r};
const fmtDate=s=>{const d=typeof s==='string'?pd(s):s;return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`};

function conv(amount,cur,rate){amount=+amount;rate=+rate||rateNow();if(cur===S.disp)return amount;return S.disp==='USD'?amount/rate:amount*rate}
function money(v,cur=S.disp,opts={}){
  const n=Math.abs(v)<1e-9?0:v;
  const r2=Math.round(n*100)/100; const dec = cur==='USD' && Math.abs(n)<1000 && r2!==Math.round(r2) ? 2 : 0;
  const s=new Intl.NumberFormat('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(Math.round(n*(dec?100:1))/(dec?100:1));
  if(opts.bare)return s;
  return `<span class="num">${cur==='USD'?'$':''}${s}</span>${cur==='SYP'?'<span class="cur">ل.س</span>':''}`;
}
const plain=(v,cur)=>(cur==='USD'?'$':'')+new Intl.NumberFormat('en-US',{maximumFractionDigits:cur==='USD'?2:0}).format(v)+(cur==='SYP'?' ل.س':'');

async function loadAll(){

    q('debts').order('created_at'), q('debt_payments').order('paid_on'), q('savings').order('moved_on',{ascending:false}),
    SB.from('rates').select('*').order('day',{ascending:false}).limit(1)

  }
}

/* ---------- calculations ---------- */
function monthRange(m=S.month){const a=new Date(m.getFullYear(),m.getMonth(),1),b=new Date(m.getFullYear(),m.getMonth()+1,0);return [iso(a),iso(b)]}
function incomeFor(m=S.month){
  const [a,b]=monthRange(m);let t=0;
  for(const x of S.incomes){ if(!x.active||x.start_date>b)continue;
    let v=0; if(x.frequency==='monthly')v=+x.amount;
    else if(x.frequency==='daily'){const s=pd(x.start_date),first=pd(a);const from=s>first?s.getDate():1;v=+x.amount*(dim(m.getFullYear(),m.getMonth())-from+1)}
    else if(pd(x.start_date).getMonth()===m.getMonth())v=+x.amount;
    t+=conv(v,x.currency,rateNow());}
  return t;
}
const expIn=(m=S.month)=>{const [a,b]=monthRange(m);return S.exp.filter(x=>x.spent_on>=a&&x.spent_on<=b)};
const spentFor=m=>expIn(m).reduce((t,x)=>t+conv(x.amount,x.currency,x.rate),0);
function debtPaidFor(m=S.month){const [a,b]=monthRange(m);return S.pays.filter(p=>p.paid_on>=a&&p.paid_on<=b).reduce((t,p)=>{const d=S.debts.find(x=>x.id===p.debt_id);return t+(d?conv(p.amount,d.currency,rateNow()):0)},0)}
const jarTotal=()=>S.sav.reduce((t,x)=>t+conv(x.amount,x.currency,rateNow()),0);
function debtInfo(d){
  const ps=S.pays.filter(p=>p.debt_id===d.id);
  const paid=ps.reduce((t,p)=>t+ +p.amount,0), remaining=Math.max(0,+d.total-paid);
  const left=Math.ceil(remaining/ +d.monthly - 1e-9);
  const start=pd(d.start_date); const t=today();
  let next=new Date(t.getFullYear(),t.getMonth(),Math.min(start.getDate(),dim(t.getFullYear(),t.getMonth())));
  const thisMonthPaid=ps.some(p=>p.paid_on.slice(0,7)===iso(t).slice(0,7));
  if(next<t||thisMonthPaid) next=addMonths(next,1);
  if(next<start) next=start;
  const end=left>0?addMonths(next,left-1):(ps.length?pd(ps[ps.length-1].paid_on):t);
  return {ps,paid,remaining,left,next,end,pct:Math.min(100,paid/ +d.total*100)};
}

/* ---------- smart parser ---------- */
function parseSmart(raw){
  let t=' '+raw.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',')+' ';
  let cur=S.inCur;
  if(/\$|دولار|usd|dollar|\bدو\b/i.test(t)){cur='USD';t=t.replace(/\$|دولارات|دولار|usd|dollars?/gi,' ')}
  else if(/ل\.?\s?س|ليره|ليرة|ليرات|syp/i.test(t)){cur='SYP';t=t.replace(/ل\.?\s?س|ليرات|ليره|ليرة|syp/gi,' ')}
  let d=today(),dateTxt='اليوم';
  const dm=[[/(اول|أول)\s*(امس|أمس)|قبل\s*(امس|أمس)|قبل البارحه|قبل البارحة/,-2],[/\s(امس|أمس|مبارح|البارح[ةه])\s/,-1],[/\sاليوم\s/,0]];
  for(const [re,n] of dm){if(re.test(t)){d.setDate(d.getDate()+n);t=t.replace(re,' ');dateTxt=n===-1?'أمس':n===-2?'أول أمس':'اليوم';break}}
  if(dateTxt==='اليوم'){WD.forEach((w,k)=>{const re=new RegExp('\\s(يوم\\s)?(ال)?'+norm(w).replace(/^ال/,'')+'\\s');if(re.test(' '+norm(t)+' ')&&t.includes(w.replace(/^ال/,''))){let back=(d.getDay()-k+7)%7||7;d.setDate(d.getDate()-back);dateTxt=w;t=t.replace(new RegExp('(يوم\\s)?(ال)?'+w.replace(/^ال/,'')),' ')}})}
  let amount=null;
  const m=t.match(/(\d[\d,]*(?:\.\d+)?)\s*(الف|ألف|آلاف|الاف|k|ك|مليون|مليون|m)?(?=\s|$)/i);
  if(m){amount=parseFloat(m[1].replace(/,/g,''));const u=(m[2]||'').toLowerCase();if(/الف|ألف|آلاف|الاف|k|ك/.test(u))amount*=1000;if(/مليون|m/.test(u))amount*=1e6;t=t.replace(m[0],' ')}
  else if(/\s(الف|ألف)\s/.test(t)){amount=1000;t=t.replace(/(الف|ألف)/,' ')}
  const note=t.replace(/\s+/g,' ').replace(/^\s*(على|ل|في)\s/,'').trim();
  let cat=null;
  for(const w of note.split(' ')){const k=norm(w);if(S.words[k]){cat=S.words[k];break}}
  if(!cat){outer:for(const w of note.split(' ')){const k=norm(w);for(const [name,list] of Object.entries(DICT)){if(list.split(' ').map(norm).includes(k)){const c=S.cats.find(c=>c.name===name);if(c){cat=c.id;break outer}}}}}
  if(!cat)cat=(S.cats.find(c=>c.name==='أخرى')||S.cats[0]||{}).id;
  return {amount,cur,date:iso(d),dateTxt,note,cat};
}

function curveCard(){
  const m=S.month,n=dim(m.getFullYear(),m.getMonth());const pm=addMonths(m,-1);
  const cum=(mm,len)=>{const a=Array(len).fill(0);expIn(mm).forEach(x=>{a[pd(x.spent_on).getDate()-1]+=conv(x.amount,x.currency,x.rate)});for(let i=1;i<len;i++)a[i]+=a[i-1];return a};
  const A=cum(m,n),B=cum(pm,dim(pm.getFullYear(),pm.getMonth()));
  const isCur=iso(m).slice(0,7)===iso(today()).slice(0,7);const last=isCur?today().getDate()-1:n-1;
  const max=Math.max(A[n-1],B[Math.min(B.length-1,n-1)],1)*1.15;
  const W=400,H=190,x=i=>i/(n-1)*W,y=v=>H-8-v/max*(H-50);
  const pts=A.slice(0,last+1).map((v,i)=>[x(i),y(v)]);
  const path=p=>p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join('');
  const bpts=B.slice(0,n).map((v,i)=>[x(i),y(v)]);
  const bv=B[Math.min(last,B.length-1)]||0,delta=bv?Math.round((A[last]-bv)/bv*100):null;
  const lp=pts[pts.length-1]||[0,H];
  return `<section class="card curve span-4">
    <div class="row"><div><div style="font-size:20px">اتجاه الصرف</div><div class="lbl">${MONTHS[m.getMonth()]} مقابل ${MONTHS[pm.getMonth()]}</div></div></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="منحنى الصرف التراكمي">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCF25A" stop-opacity=".35"/><stop offset="1" stop-color="#DCF25A" stop-opacity="0"/></linearGradient></defs>
      <path d="${path(bpts)}" fill="none" stroke="#6D7369" stroke-width="1.5" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>
      ${pts.length>1?`<path d="${path(pts)}L${lp[0]},${H}L0,${H}Z" fill="url(#g)"/><path d="${path(pts)}" fill="none" stroke="#DCF25A" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`:''}
      <line x1="${lp[0]}" x2="${lp[0]}" y1="${lp[1]}" y2="${H}" stroke="#DCF25A" stroke-opacity=".4" vector-effect="non-scaling-stroke"/>
    </svg>
    <div style="position:absolute;top:${Math.max(84,76+lp[1]-38)}px;left:clamp(12px,${(lp[0]/W*100).toFixed(1)}%,calc(100% - 80px));transform:translateX(-50%);background:#fff;color:#121411;border-radius:99px;padding:4px 10px;font-size:13px" class="num">${delta===null?money(A[last]).replace(/<[^>]+>/g,''):(delta>0?'+':'')+delta+'%'}</div>
  </section>`;
}

    <div class="grid">

    </div>`;

    body=`<div class="sectionhead"><h2 class="h">الموارد الثابتة</h2><button class="pill" style="background:var(--ink);color:var(--card)" id="addInc">${ico('plus')} مورد</button></div>
    <div class="grid"><section class="card hero span-12" style="padding-top:26px"><div class="lbl">الوارد المتوقع في ${MONTHS[S.month.getMonth()]}</div><div class="big" style="margin-top:8px">${money(incomeFor())}</div></section>
    <section class="card span-12"><div class="list">${S.incomes.length?S.incomes.map(x=>`<div class="item" style="${x.active?'':'opacity:.45'}"><span class="ic">${ico('up')}</span><div><b>${esc(x.name)}</b><small>${lab[x.frequency]}${x.frequency==='yearly'?' · '+MONTHS[pd(x.start_date).getMonth()]:''}${x.active?'':' · متوقف'}</small></div><div style="display:flex;gap:4px;align-items:center"><div class="amt">${money(+x.amount,x.currency)}</div><button class="more" data-edit-inc="${x.id}" aria-label="تعديل">${ico('dot',1.5)}</button></div></div>`).join(''):`<div class="empty">أضف راتبك أو أي دخل ثابت</div>`}</div></section></div>`;

  }
  app.innerHTML=header()+body;
  renderPreview();
}

/* ---------- sheets ---------- */
function sheet(title,html,onMount){
  const s=document.createElement('div');s.className='scrim';
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h3>${title}<button class="round" style="background:var(--soft)" data-close aria-label="إغلاق">${ico('x')}</button></h3>${html}</div>`;
  s.addEventListener('click',e=>{if(e.target===s||e.target.closest('[data-close]'))s.remove()});
  document.body.append(s);onMount?.(s);const f=s.querySelector('input');f&&setTimeout(()=>f.focus(),60);return s;
}
const curSeg=(name,val)=>`<div class="seg" data-seg="${name}"><button type="button" data-val="USD" aria-pressed="${val==='USD'}">دولار $</button><button type="button" data-val="SYP" aria-pressed="${val==='SYP'}">ليرة ل.س</button></div>`;
function wireSeg(s){s.querySelectorAll('.seg').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));}))}
const segVal=(s,n)=>s.querySelector(`[data-seg="${n}"] [aria-pressed="true"]`).dataset.val;
async function run(p,msg){const r=await p;if(r.error){toast('تعذّر الحفظ: '+r.error.message);return false}await refresh();msg&&toast(msg);return true}
async function refresh(){await loadAll();render()}

function confirmIn(btn,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed=1;btn.style.width='auto';btn.innerHTML='اضغط للتأكيد';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.innerHTML=ico('trash')}},3000)}

    <div class="btns" style="margin-top:22px"><button class="btn danger" id="out">تسجيل الخروج</button></div>
    <p class="lbl" style="text-align:center;margin-top:14px">${esc(S.user.email)}</p>`,s=>{
    wireSeg(s);
    s.querySelectorAll('.seg').forEach(g=>g.addEventListener('click',()=>{S.inCur=segVal(s,'in');S.disp=segVal(s,'disp');store.set('inCur',S.inCur);store.set('disp',S.disp);render()}));
    s.querySelectorAll('[data-cat]').forEach(i=>i.onchange=()=>run(SB.from('categories').update({name:i.value.trim()}).eq('id',i.dataset.cat),'حُفظ الاسم'));
    s.addEventListener('click',async e=>{const b=e.target.closest('[data-delcat]');if(!b)return;if(!b.dataset.armed){b.dataset.armed=1;b.style.color='var(--bad)';toast('اضغط مرة أخرى للحذف');return}
      if(await run(SB.from('categories').delete().eq('id',b.dataset.delcat),'حُذفت الفئة')){s.remove();settingsSheet()}});
    s.querySelector('#nc').onsubmit=async e=>{e.preventDefault();const n=s.querySelector('#ncn').value.trim();if(!n)return;if(await run(SB.from('categories').insert({name:n,icon:'dot',sort:S.cats.length}),'أضيفت الفئة')){s.remove();settingsSheet()}};
    s.querySelector('#out').onclick=async()=>{await SB.auth.signOut();location.reload()};
  });
}
function rateSheet(){
  const r=S.rateRow;
  sheet('سعر الدولار',`
    <div class="card hero" style="padding-top:22px;margin-bottom:14px"><div class="lbl">السعر المعتمد · السوق الموازية</div><div class="big" style="margin-top:6px"><span class="num">${S.rate?S.rate.toFixed(2):'—'}</span><span class="cur">ل.س جديدة</span></div>
    ${r?`<div class="row lbl" style="margin-top:14px"><span>شراء <b class="num">${(+r.buy).toFixed(2)}</b> · مبيع <b class="num">${(+r.sell).toFixed(2)}</b></span><span>${r.source==='manual'?'يدوي':'sp-today'} · ${fmtDate(r.day)}</span></div>`:''}</div>
    <p class="lbl" style="margin:0 0 14px">يُحدَّث تلقائياً مرتين يومياً. كل مصروف يُحفظ بسعر يومه، فلا تتغير حساباتك القديمة.</p>
    <form id="f"><div class="f"><span>تعديل يدوي لسعر اليوم</span><input id="m" inputmode="decimal" class="num" placeholder="مثال: 137.25"></div>
    <div class="btns"><button class="btn">اعتماد</button><button type="button" class="btn ghost" id="auto">${ico('swap')} جلب الآن</button></div></form>`,s=>{
    s.querySelector('#f').onsubmit=async e=>{e.preventDefault();const v=+s.querySelector('#m').value;if(!(v>20))return toast('اكتب سعراً صحيحاً');
      if(await run(SB.from('rates').upsert({day:iso(today()),buy:v,sell:v,source:'manual'}),'اعتُمد السعر'))s.remove()};
    s.querySelector('#auto').onclick=async()=>{const r=await SB.rpc('fetch_usd_rate');if(r.error||!r.data)return toast('تعذّر الجلب الآن، جرّب لاحقاً');await refresh();s.remove();toast('تم تحديث السعر')};
  });
}

/* ---------- PDF ---------- */
function pdfShell(inner){return `<div dir="rtl" style="font-family:'Readex Pro','Outfit',sans-serif;color:#121411;background:#fff;width:720px;padding:0">
  <div style="background:#DCF25A;padding:32px 40px;border-radius:0 0 36px 36px;display:flex;justify-content:space-between;align-items:center"><div style="font-family:Outfit;font-size:28px;font-weight:500">Budgeter</div><div style="font-size:13px;opacity:.65">${fmtDate(today())}</div></div>
  <div style="padding:32px 40px">${inner}</div>
  <div style="padding:0 40px 30px;font-size:11px;color:#8A9186">صدر من تطبيق Budgeter</div></div>`}
async function makePdf(html,name){
  if(!window.html2pdf)return toast('مكتبة PDF لم تُحمَّل بعد، أعد المحاولة');
  toast('جارٍ إنشاء الملف...');
  await html2pdf().set({margin:0,filename:name,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'px',format:[720,1018],hotfixes:['px_scaling']}}).from(html).save();
}
function pdfReceipt(d,pid){
  const f=debtInfo(d);const i=f.ps.findIndex(p=>p.id===pid);const p=f.ps[i];
  const paidTo=f.ps.slice(0,i+1).reduce((t,x)=>t+ +x.amount,0);
  const row=(a,b)=>`<div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #E3E7DE;font-size:15px"><span style="color:#6A7166">${a}</span><b style="font-weight:500">${b}</b></div>`;
  makePdf(pdfShell(`<div style="font-size:15px;color:#6A7166">إيصال دفعة رقم ${i+1}</div>
    <div style="font-family:Outfit;font-size:64px;font-weight:300;margin:10px 0 26px">${plain(+p.amount,d.currency)}</div>
    ${row('المستفيد',esc(d.creditor))}${row('الدين',esc(d.title||'—'))}${row('تاريخ الدفع',fmtDate(p.paid_on))}${row('إجمالي المسدَّد حتى هذه الدفعة',plain(paidTo,d.currency))}${row('المتبقي بعد هذه الدفعة',plain(Math.max(0,+d.total-paidTo),d.currency))}${p.note?row('ملاحظة',esc(p.note)):''}
    <div style="margin-top:28px;height:10px;border-radius:9px;background:#E3E7DE;overflow:hidden"><div style="height:100%;width:${Math.min(100,paidTo/d.total*100)}%;background:#121411;margin-right:0;margin-left:auto"></div></div>
    <div style="font-size:13px;color:#6A7166;margin-top:8px">${Math.round(paidTo/d.total*100)}% من الدين مُسدَّد</div>`),`إيصال-${d.creditor}-${p.paid_on}.pdf`);
}
function pdfStatement(d){
  const f=debtInfo(d);let run=0;
  const rows=f.ps.map((p,i)=>{run+=+p.amount;return `<tr><td style="padding:10px 8px;border-bottom:1px solid #E3E7DE">${i+1}</td><td style="padding:10px 8px;border-bottom:1px solid #E3E7DE">${fmtDate(p.paid_on)}</td><td style="padding:10px 8px;border-bottom:1px solid #E3E7DE;font-family:Outfit">${plain(+p.amount,d.currency)}</td><td style="padding:10px 8px;border-bottom:1px solid #E3E7DE;font-family:Outfit">${plain(Math.max(0,+d.total-run),d.currency)}</td></tr>`}).join('');
  makePdf(pdfShell(`<div style="font-size:15px;color:#6A7166">كشف حساب دين</div><div style="font-size:30px;margin:6px 0 20px">${esc(d.creditor)}${d.title?' · '+esc(d.title):''}</div>
    <div style="display:flex;gap:10px;margin-bottom:24px">${[['المبلغ الكلي',plain(+d.total,d.currency)],['المسدَّد',plain(f.paid,d.currency)],['المتبقي',plain(f.remaining,d.currency)],['نهاية متوقعة',f.remaining>0?MONTHS[f.end.getMonth()]+' '+f.end.getFullYear():'مُسدَّد']].map(([a,b],k)=>`<div style="flex:1;background:${k===2?'#DCF25A':'#F0F2EC'};border-radius:18px;padding:14px"><div style="font-size:11px;color:#6A7166">${a}</div><div style="font-family:Outfit;font-size:19px;margin-top:4px">${b}</div></div>`).join('')}</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;text-align:right"><thead><tr style="color:#6A7166"><th style="padding:8px;font-weight:400">#</th><th style="padding:8px;font-weight:400">التاريخ</th><th style="padding:8px;font-weight:400">المبلغ</th><th style="padding:8px;font-weight:400">المتبقي بعدها</th></tr></thead><tbody>${rows}</tbody></table>`),`كشف-${d.creditor}.pdf`);
}

/* ---------- events ---------- */
app.addEventListener('input',e=>{if(e.target.id==='smartIn'){const v=e.target.value.trim();S.draft=v?parseSmart(v):null;renderPreview()}});
app.addEventListener('submit',async e=>{
  if(e.target.id!=='smart')return;e.preventDefault();const d=S.draft;
  if(!d||!d.amount){toast('اكتب المبلغ، مثلاً: غدا 75 ألف');return}
  const r=await SB.from('expenses').insert({amount:d.amount,currency:d.cur,rate:rateNow(),category_id:d.cat,note:d.note||null,spent_on:d.date});
  if(r.error)return toast('تعذّر الحفظ: '+r.error.message);
  const words=(d.note||'').split(' ').map(norm).filter(w=>w.length>1&&!/^\d/.test(w)).slice(0,3);
  if(words.length)await SB.from('word_map').upsert(words.map(w=>({word:w,category_id:d.cat})));
  S.draft=null;S.selDay=d.date;await refresh();toast(`أُضيف ${plain(d.amount,d.cur)} · ${catById(d.cat).name}`);
  document.getElementById('smartIn')?.focus();
});
app.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]');if(!t)return;
  if(t.id==='mPrev'||t.id==='mNext'){S.month=addMonths(S.month,t.id==='mPrev'?-1:1);const d=new Date(S.month);if(iso(d).slice(0,7)===iso(today()).slice(0,7))S.selDay=iso(today());else S.selDay=iso(d);return render()}
  if(t.id==='wPrev'||t.id==='wNext'){const d=pd(S.selDay);d.setDate(d.getDate()+(t.id==='wPrev'?-7:7));S.selDay=iso(d);if(d.getMonth()!==S.month.getMonth()){S.month=new Date(d.getFullYear(),d.getMonth(),1)}return render()}
  if(t.dataset.day){S.selDay=t.dataset.day;return render()}
  if(t.id==='dispBtn'){S.disp=S.disp==='USD'?'SYP':'USD';store.set('disp',S.disp);return render()}
  if(t.id==='setBtn')return settingsSheet();
  if(t.id==='rateBtn')return rateSheet();
  if(t.dataset.go){S.view=t.dataset.go;render();scrollTo(0,0);return}
  if(t.dataset.quick){const i=document.getElementById('smartIn');i.value=t.dataset.quick+' ';i.focus();S.draft=parseSmart(i.value);renderPreview();return}
  if(t.dataset.editExp)return expSheet(S.exp.find(x=>x.id===t.dataset.editExp));
  if(t.dataset.editInc)return incSheet(S.incomes.find(x=>x.id===t.dataset.editInc));
  if(t.dataset.debt)return debtDetail(t.dataset.debt);
  if(t.dataset.jar)return jarSheet(+t.dataset.jar);
  if(t.dataset.delSav){if(!t.dataset.armed){t.dataset.armed=1;t.style.color='var(--bad)';toast('اضغط مرة أخرى للحذف');return}return run(SB.from('savings').delete().eq('id',t.dataset.delSav),'حُذفت الحركة')}
  if(t.id==='addExp')return expSheet();
  if(t.id==='addDebt'||t.id==='addDebt2')return debtSheet();
  if(t.id==='addInc')return incSheet();
  const d=S.draft;if(!d)return;
  if(t.hasAttribute('data-pcur')){d.cur=d.cur==='USD'?'SYP':'USD';return renderPreview()}
  if(t.dataset.pcat){d.cat=t.dataset.pcat;return renderPreview()}
  if(t.hasAttribute('data-old')){d.amount=d.amount/100;return renderPreview()}
  if(t.hasAttribute('data-pdate')){const opts=[0,-1,-2];const cur=opts.findIndex(n=>iso(new Date(today().getTime()+n*864e5))===d.date);const n=opts[(cur+1)%3]??0;const dd=today();dd.setDate(dd.getDate()+n);d.date=iso(dd);d.dateTxt=n===0?'اليوم':n===-1?'أمس':'أول أمس';return renderPreview()}
});
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.v;render();scrollTo(0,0)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.user&&!document.querySelector('.scrim')&&!document.activeElement?.value)refresh().catch(()=>{})});

/* ---------- auth ---------- */
function authView(mode='in',msg=''){
  document.getElementById('nav').hidden=true;
  app.innerHTML=`<div class="auth"><section class="card hero">
    <div class="notch"><span class="round">${ico('wallet')}</span></div>
    <div class="hero-title"><div><b style="font-size:22px">Budgeter</b><small>مصروفاتك، ديونك، وحصالتك</small></div></div>
    <h1 class="h" style="font-size:34px;margin-bottom:18px">${mode==='in'?'أهلاً بعودتك':'حساب جديد'}</h1>
    <form id="af">
      <div class="f"><span>البريد الإلكتروني</span><input id="em" type="email" autocomplete="email" required style="background:rgba(255,255,255,.6);border-color:transparent"></div>
      <div class="f"><span>كلمة المرور</span><input id="pw" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}" minlength="6" required style="background:rgba(255,255,255,.6);border-color:transparent"></div>
      ${msg?`<p style="font-size:14px;margin:4px 0 12px">${msg}</p>`:''}
      <button class="btn">${mode==='in'?'دخول':'إنشاء الحساب'}</button>
    </form>
    <button class="btn ghost" style="background:transparent;margin-top:6px;color:var(--lime-ink)" id="sw">${mode==='in'?'ليس لديك حساب؟ أنشئ واحداً':'لديك حساب؟ سجّل الدخول'}</button>
  </section></div>`;
  document.getElementById('sw').onclick=()=>authView(mode==='in'?'up':'in');
  document.getElementById('af').onsubmit=async e=>{e.preventDefault();const email=em.value.trim(),password=pw.value;
    const r=mode==='in'?await SB.auth.signInWithPassword({email,password}):await SB.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
    if(r.error)return authView(mode,r.error.message==='Invalid login credentials'?'البريد أو كلمة المرور غير صحيحة.':esc(r.error.message));
    if(mode==='up'&&!r.data.session)return authView('in','أرسلنا رابط تأكيد إلى بريدك. افتحه ثم سجّل الدخول هنا.');
    boot();
  };
}
async function boot(){
  const {data}=await SB.auth.getSession();
  if(!data.session)return authView();
  S.user=data.session.user;
  app.innerHTML=`<div style="padding:30vh 0;text-align:center" class="lbl">جارٍ التحميل...</div>`;
  try{await loadAll();render()}catch(err){app.innerHTML=`<div class="card" style="margin-top:20vh">تعذّر تحميل البيانات: ${esc(err.message)}<br><br><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>`}
}
boot();
</script>
